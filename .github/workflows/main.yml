# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
      # To consume code-obos packages
      packages: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure GitHub Packages auth
        # pnpm/setup has no `registry-url` equivalent, so write the token into
        # the runner's own (ephemeral, never committed) user-level .npmrc
        # before pnpm/setup installs dependencies below.
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm, node and install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          # pnpm version and node runtime are read from package.json's
          # `packageManager` and `devEngines.runtime` fields.
          cache: true
          install: true

      # Build packages and generate docs artifacts before lint so that
      # type-aware linting can resolve workspace package types and the
      # generated `@/component-props` / `@/colors` modules used by docs.
      - name: Build packages
        run: pnpm run build

      - name: Generate docs artifacts
        run: pnpm --filter @obosbbl/grunnmuren-docs run build:props && pnpm --filter @obosbbl/grunnmuren-docs run build:colors

      - name: lint
        run: pnpm lint && pnpm fmt:check

      # It makes sense to do this on PRs to ensure the change didn't break the Storybook
      - name: Build storybook
        run: pnpm build:storybook

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # Token parity plus a screenshot per story. Baselines live in the repo and are
      # only ever generated by update-screenshot-baselines.yml, never locally.
      - name: Test
        run: pnpm test

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: .vitest/attachments/
          # upload-artifact skips dot directories by default, and this is one
          include-hidden-files: true
          retention-days: 7
