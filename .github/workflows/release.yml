name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
      # Write permission is required so that it can push to github registry
      packages: write
      # required for OIDC
      id-token: write

    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm, node and install dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          # pnpm version and node runtime are read from package.json's
          # `packageManager` and `devEngines.runtime` fields.
          cache: true
          install: true
        # GitHub Packages auth for @code-obos (the registry itself is mapped in
        # the project .npmrc). Step-level env covers this action's install.
        env:
          pnpm_config__auth: |
            {
              "https://npm.pkg.github.com": {
                "@code-obos": {
                  "authToken": ${{ toJSON(secrets.GITHUB_TOKEN) }}
                }
              }
            }

      - name: Create Release Pull Request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm ci:version
          commit-message: 'chore: update versions'
          publish-script: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
