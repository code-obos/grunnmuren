packages:
  - 'packages/**'
  - 'apps/**'

skills:
  dirs:
    - .agents/skills

permissions:
  '@tanstack/react-form':
    skills:
      - react-form-composition-setup
      - error-visibility-workflows
      - schema-driven-forms
      - reusable-form-policies
      - type-error-debugging
      - choosing-form-options-modes

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  lefthook: true
  protobufjs: false
  unrs-resolver: false

catalog:
  '@tailwindcss/node': 4.3.5
  '@tailwindcss/vite': 4.3.5
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.5
